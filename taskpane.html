<!doctype html><html lang=zh-CN><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=x-app-version content=1.0.0.10><title>Excel 窗口标签</title><script src=https://appsforoffice.microsoft.com/lib/1/hosted/office.js></script><link rel=stylesheet href="taskpane.css?v=1.0.0.10"></head><body><main id=app><header class=toolbar><button id=btn-new type=button title=新建工作簿>＋ 新建</button> <button id=btn-align type=button aria-pressed=false title=对齐模式：把所有工作簿窗口叠放到同一位置和大小，切换时看起来像单窗口标签>对齐：关</button> <button id=btn-realign type=button class="icon-btn hidden" title=重新对齐：把对齐基准重新套用到所有窗口>⇥</button> <button id=btn-setbase type=button class="icon-btn hidden" title=以当前窗口为基准：用当前活动窗口的位置和大小作为新的对齐基准>◎</button> <button id=btn-refresh type=button class=icon-btn title=立即刷新>⟳</button></header><div id=toast-area class=toast-area role=status aria-live=polite></div><section id=tab-list class=tab-list role=tablist aria-label=工作簿窗口></section><footer class=footer><label class=auto-open title=把当前工作簿标记为“打开时自动显示标签栏”><input id=chk-auto-open type=checkbox> 在此工作簿中自动打开</label><p id=status class=status><div class=footer-row><button id=btn-display-mode type=button class=link-btn>显示：完整</button> <span class=footer-sep>·</span> <span id=shortcut-hint class=hint></span></div></footer></main><section id=unsupported class="unsupported hidden"><h2>当前环境不受支持</h2><p id=unsupported-text>需要支持 ExcelApiDesktop 1.1 的桌面版 Excel（Microsoft 365 for Mac / Windows）。</section><script src="taskpane.js?v=1.0.0.10"></script></body></html>
