<!doctype html><html lang=zh-CN><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Excel 窗口标签</title><script src=https://appsforoffice.microsoft.com/lib/1/hosted/office.js></script><link rel=stylesheet href=taskpane.css><script defer src=taskpane.js></script></head><body><main id=app><header class=toolbar><button id=btn-new type=button title=新建工作簿>＋ 新建</button> <button id=btn-align type=button aria-pressed=false title=对齐模式：把所有工作簿窗口叠放到同一位置和大小，切换时看起来像单窗口标签>对齐：关</button> <button id=btn-refresh type=button title=立即刷新>⟳</button></header><section id=tab-list class=tab-list role=tablist aria-label=工作簿窗口></section><footer class=footer><label class=auto-open title=把当前工作簿标记为“打开时自动显示标签栏”><input id=chk-auto-open type=checkbox> 在此工作簿中自动打开</label><p id=status class=status></footer></main><section id=unsupported class="unsupported hidden"><h2>当前环境不受支持</h2><p id=unsupported-text>需要支持 ExcelApiDesktop 1.1 的桌面版 Excel（Microsoft 365 for Mac / Windows）。</section></body></html>
